services:
  - type: web
    name: dress-shop-backend
    runtime: node
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false          # ← You will paste this in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false          # ← You will paste this in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false          # ← You will paste this in Render dashboard
